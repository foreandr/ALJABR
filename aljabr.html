<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ALJABR — Mathlib Atlas</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#dce6f4;background:#0c1421;font-size:14px}*{box-sizing:border-box}body{margin:0}header{padding:13px 20px;border-bottom:1px solid #29405b;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#121e2d}header strong{letter-spacing:.11em;font-size:18px}header .info{font-size:12px;color:#97adc6}#stats{margin-left:auto;display:flex;gap:15px;flex-wrap:wrap;font-size:12px}#stats b{color:#c7e3ff;font-size:17px}main{display:grid;grid-template-columns:285px minmax(0,1fr) 330px;height:calc(100vh - 69px);min-height:540px}aside,.detail{padding:15px;border-right:1px solid #29405b;overflow:auto}.detail{border-left:1px solid #29405b;border-right:0}input,select,button{background:#1b2e45;color:#e3edfa;border:1px solid #3b5574;border-radius:4px;padding:9px;font:inherit}input{width:100%}button{cursor:pointer}button:hover,.item:hover{background:#264361}#list{margin-top:12px}.item{padding:9px;border-bottom:1px solid #233750;cursor:pointer;overflow-wrap:anywhere}.item.sel{background:#243e59;border-left:3px solid #e9bf63}.item small{display:block;color:#8fa5bc;margin-top:3px}#canvas{overflow:hidden;position:relative;background-color:#0c1421;background-image:radial-gradient(#203147 1px,transparent 1px);background-size:23px 23px}svg{width:100%;height:100%;touch-action:none}svg text{fill:#e2ebf9;font:12px Arial;pointer-events:none}svg .edge{stroke:#6686ac;stroke-width:1.4;opacity:.65}svg .edge.extends{stroke:#e0b768;stroke-width:2.3;opacity:.95}svg rect{fill:#192a40;stroke:#6886a8;stroke-width:1.2;cursor:pointer}svg g.core rect{stroke:#ebc36d;stroke-width:2.5;fill:#334153}svg g:hover rect{fill:#3a5271}.toolbar{position:absolute;top:10px;left:10px;display:flex;gap:6px}h3{margin:7px 0 14px}p{line-height:1.5}.muted{color:#92a9c4}.tag{display:inline-block;padding:3px 6px;border:1px solid #3d5470;margin:2px;border-radius:3px;font-size:12px}.dep{display:block;padding:7px 4px;color:#badafe;cursor:pointer;overflow-wrap:anywhere;border-bottom:1px solid #283a50}#message{position:absolute;top:55px;left:12px;right:12px;text-align:center;color:#a7bed8;pointer-events:none}.sub{font-size:11px;color:#8499b1}@media(max-width:950px){main{grid-template-columns:210px minmax(0,1fr)}.detail{grid-column:1/-1;border-top:1px solid #29405b;max-height:280px}main{height:auto}#canvas{height:470px}} </style></head>
<body><header><div><strong>ALJABR</strong><div class="info">Mathlib · Lean Graph · Formal dependency atlas</div></div><div id="stats"><span><b id="sn">0</b> declarations</span><span><b id="se">0</b> dependencies</span><span><b id="ss">0</b> structures/classes</span><span id="sourceStatus">Not imported</span></div></header>
<main><aside><h3>Explore mathematics</h3><input id="query" placeholder="Find a declaration…" autofocus><div style="display:flex;gap:6px;margin-top:8px"><select id="type"><option value="">All declaration types</option><option value="structure">Structures</option><option value="class">Classes</option><option value="thm">Theorems</option><option value="def">Definitions</option><option value="inst">Instances</option><option value="axiom">Axioms</option><option value="inductive">Inductive</option></select></div><div id="count" class="sub" style="padding-top:12px"></div><div id="list"></div></aside><section id="canvas"><div class="toolbar"><button id="back">← Back</button><button id="reset">Fit</button><select id="edges"><option value="">All edges</option><option value="extends">Inheritance</option><option value="field">Fields</option><option value="sig">Signatures</option><option value="proof">Proofs</option><option value="def">Definitions</option><option value="docref">Documentation</option></select></div><div id="message"></div><svg id="graph" viewBox="0 0 950 620" aria-label="Interactive dependency graph"></svg></section><section class="detail"><h3>Declaration inspector</h3><div id="details" class="muted">Select a declaration to inspect its Mathlib dependencies.</div></section></main><script src="aljabr-data.js"></script><script>
(()=>{'use strict';const d=window.ALJABR_DATA||{nodes:[],edges:[],metadata:{}};const $=id=>document.getElementById(id),nodes=d.nodes||[],edges=d.edges||[],lookup=new Map(nodes.map(n=>[n.id,n])),out=new Map(),incoming=new Map();for(const e of edges){if(!out.has(e.source))out.set(e.source,[]);out.get(e.source).push(e);if(!incoming.has(e.target))incoming.set(e.target,[]);incoming.get(e.target).push(e)}const fmt=n=>Number(n||0).toLocaleString();$('sn').textContent=fmt(nodes.length);$('se').textContent=fmt(edges.length);$('ss').textContent=fmt(nodes.filter(n=>['structure','class'].includes(n.decl_type)).length);$('sourceStatus').textContent=nodes.length?'Real Lean Graph import':'No Mathlib imported';let selected=null,history=[];let filter='',edgeFilter='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function search(){const term=$('query').value.trim().toLowerCase(),type=$('type').value;let found=[];for(const n of nodes){if(type&&n.decl_type!==type)continue;if(term&&!n.name.toLowerCase().includes(term))continue;found.push(n);if(found.length>=180)break} $('count').textContent=nodes.length?`First ${found.length} matching declarations (max 180 shown)`:'No imported data yet';$('list').innerHTML=found.map(n=>`<div class="item ${selected===n.id?'sel':''}" data-id="${esc(n.id)}">${esc(n.name)}<small>${esc(n.decl_type)} · ${esc(n.module)}</small></div>`).join('');}
function show(id,save=true){if(!lookup.has(id))return;if(save&&selected)history.push(selected);selected=id;search();const n=lookup.get(id);const outs=(out.get(id)||[]),ins=(incoming.get(id)||[]);const group=es=>es.slice(0,100).map(e=>`<div class="dep" data-go="${esc(e.target)}">${esc(e.target.replace(/^lean:/,''))} <span class="sub">${esc(e.kind)}</span></div>`).join('');$('details').innerHTML=`<strong>${esc(n.name)}</strong><p class="muted">${esc(n.docstring||'No documentation provided by exporter.')}</p><div class="tag">${esc(n.decl_type)}</div><div class="tag">${esc(n.module)}</div><h3>Dependencies (${fmt(outs.length)})</h3>${group(outs)}<h3>Used by (${fmt(ins.length)})</h3>${ins.slice(0,100).map(e=>`<div class="dep" data-go="${esc(e.source)}">${esc(e.source.replace(/^lean:/,''))} <span class="sub">${esc(e.kind)}</span></div>`).join('')}`;draw();location.hash=encodeURIComponent(n.name)}
function draw(){const svg=$('graph');svg.replaceChildren();if(!selected){$('message').textContent=nodes.length?'Search or click a declaration to explore.':'No Mathlib graph imported. Run 1_UPDATE_MATHEMATICS.bat first.';return}$('message').textContent='';let outgoing=(out.get(selected)||[]).filter(e=>!edgeFilter||e.kind===edgeFilter).slice(0,22),inbound=(incoming.get(selected)||[]).filter(e=>!edgeFilter||e.kind===edgeFilter).slice(0,22),ids=[...new Set([...outgoing.map(e=>e.target),...inbound.map(e=>e.source)])].filter(x=>lookup.has(x)&&x!==selected).slice(0,40);const total=ids.length,pts=new Map([[selected,[475,300]]]);ids.forEach((id,i)=>{let a=2*Math.PI*i/Math.max(total,1)-Math.PI/2;pts.set(id,[475+Math.cos(a)*Math.min(325,Math.max(190,total*8)),300+Math.sin(a)*Math.min(230,Math.max(150,total*6))])});const ns='http://www.w3.org/2000/svg',el=(type,attrs,parent=svg)=>{const n=document.createElementNS(ns,type);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));parent.appendChild(n);return n};for(const e of [...outgoing,...inbound]){if(!pts.has(e.source)||!pts.has(e.target))continue;let a=pts.get(e.source),b=pts.get(e.target);el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'edge '+e.kind})}for(const [id,[x,y]] of pts){const n=lookup.get(id),g=el('g',{class:id===selected?'core':'', 'data-id':id}),w=188;el('rect',{x:x-w/2,y:y-20,width:w,height:40,rx:5},g);let text=el('text',{x,y:y+4,'text-anchor':'middle'},g);const name=n.name.length>27?n.name.slice(0,25)+'…':n.name;text.textContent=name;g.addEventListener('click',()=>show(id))}}
$('query').addEventListener('input',search);$('type').addEventListener('change',search);$('edges').addEventListener('change',e=>{edgeFilter=e.target.value;draw()});$('list').addEventListener('click',e=>{let x=e.target.closest('[data-id]');if(x)show(x.dataset.id)});$('details').addEventListener('click',e=>{let x=e.target.closest('[data-go]');if(x)show(x.dataset.go)});$('back').onclick=()=>{if(history.length)show(history.pop(),false)};$('reset').onclick=draw;search();if(nodes.length){let first=nodes.find(n=>/^(Module|Group|Ring|LinearMap)$/.test(n.name))||nodes.find(n=>n.decl_type==='structure')||nodes[0];show(first.id,false)}
})();
</script></body></html>
