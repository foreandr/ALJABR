<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALJABR — Construction atlas</title>
<style>
:root{--bg:#0a1226;--pn:#0c162c;--ln:#22314f;--tx:#e6ecf8;--mu:#8393b3;--gold:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 320px;height:100%}
#cv{position:relative;overflow:hidden;touch-action:none;cursor:grab;min-width:0}
#cv.pan{cursor:grabbing}
svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.n{cursor:pointer;outline:none}
.n:focus-visible .sh{stroke:#fff;stroke-width:3}
#bar{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#bar>*{pointer-events:auto}
button,input{font:inherit;color:inherit}
.b{background:#12203d;border:1px solid var(--ln);border-radius:8px;padding:7px 13px;cursor:pointer;min-height:34px}
.b:hover:not(:disabled),.b:focus-visible{border-color:var(--gold);outline:none}
.b:disabled{opacity:.3;cursor:default}
#brand{font:600 13px Georgia,serif;letter-spacing:.32em;margin-right:10px;color:#cfd9ee}
#q{background:#0d1a34;border:1px solid var(--ln);border-radius:8px;padding:7px 11px;width:170px;min-height:34px}
#q:focus{outline:none;border-color:var(--gold)}
.dp{display:flex;gap:8px;align-items:center;color:var(--mu);background:#12203d;border:1px solid var(--ln);border-radius:8px;padding:0 12px;min-height:34px}
.dp input{width:90px;accent-color:var(--gold)}
#mw{padding:3px 5px;gap:5px;min-width:0;max-width:min(540px,calc(100vw - 40px));border-color:#4b3c17;box-shadow:0 0 0 1px #7b581d55}
#mw .b{padding:2px 11px;min-height:30px;font-size:18px}
#methodCount{color:#fbbf24;font-weight:800;white-space:nowrap;font-size:12px;background:#3b2c13;border:1px solid #956719;border-radius:6px;padding:5px 8px}
#mt{color:#dbe5f7;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:245px;flex:1}
#methodsList{white-space:nowrap;font-weight:700;color:#fbbf24;border-color:#8d661b;background:#2d2518}
#methodMenu{position:absolute;left:175px;top:54px;z-index:8;max-width:min(650px,calc(100vw - 32px));width:480px;max-height:65vh;overflow:auto;background:#101d35;border:1px solid #a87923;border-radius:12px;padding:10px;box-shadow:0 18px 48px #0009;display:none}
#methodMenu.open{display:block}
#methodMenu header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:700;color:#fbbf24}
.method-option{display:block;width:100%;text-align:left;padding:11px 12px;margin:5px 0;background:#14233e;border:1px solid #334462;border-radius:9px;cursor:pointer;color:#dbe5f7}
.method-option:hover,.method-option.active{border-color:#fbbf24;background:#2a2b35}
.method-option strong{display:block;font-size:13px;color:#fbbf24;margin-bottom:4px}
.method-option small{display:block;font-size:11px;line-height:1.5;color:#c2cde0;white-space:normal}
@media(max-width:900px){#methodMenu{left:12px;top:104px;width:calc(100vw - 24px)}#mw{max-width:100%}}
#vb{margin-left:auto;font:12px ui-monospace,Menlo,monospace}
#vp{position:absolute;top:56px;right:14px;background:#0d1a34;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;font:11.5px ui-monospace,Menlo,monospace;display:none;z-index:4;line-height:1.7}
#vp.o{display:block}
#ins{background:var(--pn);border-left:1px solid var(--ln);padding:62px 20px 24px;overflow:auto}
#ins h2{font:600 24px/1.15 Georgia,"Times New Roman",serif;margin:2px 0 8px}
#ins p{margin:0 0 10px;color:#c3cee6}
.k{font-size:11px;letter-spacing:.06em}
.m{font:italic 13px Georgia,serif;letter-spacing:0}
.sc{margin:18px 0 4px;color:var(--mu);font-size:11.5px}
.rt{border:1px solid var(--ln);border-radius:10px;padding:9px 11px;margin:7px 0}
.rt:hover{border-color:#fff4}
.rh{display:flex;justify-content:space-between;font-weight:600;margin-bottom:3px}
.rh span{font-weight:400;color:var(--mu);font-size:11.5px}
.l{color:var(--mu);font-size:11.5px;margin-top:5px}
.chip{background:#12203d;border:1px solid var(--c);border-radius:6px;padding:3px 9px;margin:3px 5px 2px 0;cursor:pointer}
.chip:hover,.chip:focus-visible{background:#1a2c52;outline:none}
.chip i{color:var(--mu);margin-left:6px;font:italic 12px Georgia,serif}
details{margin:6px 0}summary{cursor:pointer;color:var(--mu)}
code{display:block;white-space:pre-wrap;margin-top:5px;font:12.5px ui-monospace,Menlo,monospace;color:#d8e2f7;background:#0a1226;padding:7px 9px;border-radius:6px}
.th{margin-top:14px;padding:8px 11px;border-left:2px solid var(--mu);color:var(--mu)}
.ev{display:flex;gap:5px;align-items:center;margin-top:20px;color:var(--mu);font-size:11.5px}
.ev b{width:8px;height:8px;border-radius:50%;border:1px solid var(--mu)}.ev b.f{background:var(--gold);border-color:var(--gold)}
#tg{display:none}
@media(max-width:820px){
#app{grid-template-columns:1fr}
#ins{position:absolute;right:0;top:0;bottom:0;width:min(320px,88vw);transform:translateX(100%);transition:transform .25s;z-index:5}
#ins.o{transform:none}#tg{display:inline-block}#vb{margin-left:0}}
@media(prefers-reduced-motion:reduce){#ins{transition:none}}
</style></head><body>
<div id="app">
<div id="cv">
<svg id="sv" role="application" aria-label="ALJABR mathematical dependency graph"><defs>
<pattern id="dt" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2a49"/></pattern>
<filter id="gl" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#fbbf24" flood-opacity=".75"/></filter></defs>
<g id="wd"><rect x="-9000" y="-9000" width="26000" height="26000" fill="url(#dt)"/><g id="rg"></g><g id="ed"></g><g id="sg"></g><g id="nd"></g></g></svg>
<div id="bar"><span id="brand">ALJABR</span><a class="b" href="aljabr.html" title="Open the imported Lean declaration graph">Lean dependencies ↗</a>
<button class="b" id="bk" aria-label="Back">‹ Back</button><button class="b" id="fw" aria-label="Forward">Forward ›</button>
<button class="b" id="rn">Random</button><button class="b" id="focus" aria-pressed="true" title="Show the selected construction only">Focused ✓</button>
<div class="dp" id="mw"><button class="b" id="mp" aria-label="Previous method">‹</button><span id="methodCount" aria-live="polite"></span><span id="mt"></span><button class="b" id="mn" aria-label="Next method">›</button><button class="b" id="methodsList" aria-label="Show all construction methods" aria-expanded="false">Routes ▾</button></div><div id="methodMenu" role="group" aria-label="Construction methods"></div>
<input id="q" list="nl" placeholder="Search  /" aria-label="Search concepts"><datalist id="nl"></datalist>
<label class="dp">Trace <input type="range" id="dp" min="1" max="12" value="10"><span id="dv">10</span></label>
<button class="b" id="vb" aria-label="Validation report"></button><button class="b" id="tg" aria-label="Inspector">i</button></div>
<div id="vp"></div></div>
<aside id="ins" aria-live="polite"></aside></div>
<script>
const PURPLE='#c4a0ff';
const K={S:'STRUCTURE',M:'MAP',A:'AXIOM'},C={S:'#6cb4ff',M:'#f0a15b',A:'#7be0b4'},GOLD='#fbbf24',CY='#22d3ee',PK='#f472b6';
/* ---------- atlas model ---------- */
const N={},L=[];
const bd=x=>{const[a,b]=x.split('@');return[a,b.split(',')]};
const D=(id,k,name,d,o={})=>{const n={id,k,name,d,ev:0,w:1,...o};
if(o.dom){n.db=o.dom.map(x=>bd(x)[1]);n.dom=o.dom.map(x=>bd(x)[0]);n.cb=o.cod.map(x=>bd(x)[1]);n.cod=o.cod.map(x=>bd(x)[0])}
if(!n.ty)n.ty=k=='S'&&n.pa.length==1?[id]:n.pa.map(()=>null);L.push(N[id]=n)};
D('set','S','Set','Primitive collection of elements. Every carrier starts here.',{pa:['S'],w:4,fm:'x ∈ S'});
D('binop','M','Binary operation','A map on one carrier. By itself it satisfies no axioms.',{pa:['S'],sig:'S × S → S',dom:['set@S','set@S'],cod:['set@S'],fm:'∗ : S × S → S'});
D('assoc','A','Associativity','Grouping of repeated applications is irrelevant.',{pa:['S'],fm:'∀a,b,c : (a∗b)∗c = a∗(b∗c)'});
D('ident','A','Identity element','A two-sided neutral element exists.',{pa:['S'],fm:'∃e ∀a : e∗a = a∗e = a'});
D('inv','A','Inverses','Every element has a two-sided inverse.',{pa:['S'],fm:'∀a ∃a⁻¹ : a∗a⁻¹ = a⁻¹∗a = e'});
D('magma','S','Magma','A set with a binary operation, with no axioms imposed on that operation.',{pa:['G'],w:3});
D('semigroup','S','Semigroup','A set equipped with an associative binary operation.',{pa:['G'],w:3});
D('monoid','S','Monoid','A semigroup equipped with a two-sided identity element.',{pa:['G'],w:4});
D('group','S','Group','A monoid in which every element has a two-sided inverse.',{pa:['G'],w:6});
D('comm','A','Commutativity','The operation does not depend on order.',{pa:['A'],fm:'∀a,b : a∗b = b∗a'});
D('abgrp','S','Abelian group','A group whose operation is commutative. Written additively it is (V,+).',{pa:['A'],w:3});
D('subtest','A','Subgroup test','Nonempty subset closed under the restricted operation and inverses.',{pa:['G','N'],fm:'N ≠ ∅ ∧ ∀a,b∈N : ab⁻¹ ∈ N'});
D('subgroup','S','Subgroup','A subset N of a specified group G, with the operation restricted from G.',{pa:['G','N'],ty:['group',null],p:'N ≤ G',w:4});
D('normality','A','Normality','Conjugation preserves the subgroup. Constrains an already chosen N ≤ G.',{pa:['G','N'],fm:'∀g∈G : gNg⁻¹ = N'});
D('hom','M','Group homomorphism','Structure-preserving map between two groups. Not a self-map in general.',{pa:['G','H'],ty:['group','group'],sig:'f: G → H',dom:['group@G'],cod:['group@H'],lw:['homlaw'],fm:'f(ab) = f(a)f(b)'});
D('homlaw','A','Homomorphism law','f preserves the operation. Without it, ker f and im f need not be subgroups.',{pa:['G','H'],fm:'∀a,b : f(ab) = f(a)f(b)'});
D('cform','M','Coset formation','Restricts the operation of G to G × N. The cosets are its images gN.',{pa:['G','N'],sig:'G × N → G',dom:['group@G','subgroup@G,N'],cod:['group@G'],fm:'(g,n) ↦ gn,   gN = { gn : n ∈ N }'});
D('normal','S','Normal subgroup','A subgroup of a specified G that is stable under conjugation.',{pa:['G','N'],ty:['group',null],p:'N ◁ G',w:6});
D('cosets','S','Coset set','Cosets gN, formed by applying the operation of G to N. Depends on both G and N.',{pa:['G','N'],ty:['group',null],p:'G/N',fm:'G/N = { gN : g ∈ G }',w:3});
D('wdef','A','Well-definedness','The product is independent of representatives. Normality guarantees it.',{pa:['G','N'],fm:'aN=a′N ∧ bN=b′N ⇒ abN = a′b′N'});
D('cmul','M','Coset multiplication','Induced product on cosets.',{pa:['G','N'],sig:'G/N × G/N → G/N',dom:['cosets@G,N','cosets@G,N'],cod:['cosets@G,N'],lw:['wdef'],fm:'(aN)(bN) = (ab)N'});
D('quotient','S','Quotient group','Cosets with the induced, well-defined operation.',{pa:['G','N'],ty:['group',null],p:'G/N',w:5,thm:'First isomorphism theorem: G/ker f ≅ H for surjective f. A characterization, not an input.'});
D('qproj','M','Quotient projection','Canonical surjective homomorphism with kernel N.',{pa:['G','N'],sig:'q: G → G/N',dom:['group@G'],cod:['quotient@G,N'],der:'quotient',fm:'q(g) = gN,  ker q = N'});
D('zero','A','Additive identity (zero)','The additive group has a unique identity 0. Inherited by all rings and modules.',{pa:['R'],fm:'∀a∈R: 0+a=a+0=a'});
D('rassoc','A','Multiplicative associativity','Multiplication is associative; this is independent of additive associativity.',{pa:['R'],fm:'∀a,b,c∈R: (ab)c=a(bc)'});
D('runit','A','Multiplicative identity','A distinguished element 1 is a two-sided identity. Unital-ring convention.',{pa:['R'],fm:'∃1∈R ∀a∈R: 1a=a1=a'});
D('ldist','A','Left distributivity','Left multiplication distributes over addition.',{pa:['R'],fm:'∀a,b,c∈R: a(b+c)=ab+ac'});
D('rdist','A','Right distributivity','Right multiplication distributes over addition.',{pa:['R'],fm:'∀a,b,c∈R: (a+b)c=ac+bc'});
D('rmul','M','Ring multiplication','A second operation on the carrier of (R,+).',{pa:['R'],sig:'R × R → R',dom:['abgrp@R','abgrp@R'],cod:['abgrp@R'],lw:['rassoc','runit','ldist','rdist'],fm:'· : R × R → R'});
D('ring','S','Ring','Abelian group under +, plus a unital multiplication that distributes over it.',{pa:['R'],w:4});
D('mcomm','A','Multiplicative commutativity','Multiplication is commutative.',{pa:['R'],fm:'∀a,b : ab = ba'});
D('cring','S','Commutative ring','A ring whose multiplication commutes. Operations are inherited.',{pa:['R'],w:3});
D('nontriv','A','Nontriviality','Additive and multiplicative identities differ.',{pa:['F'],fm:'0 ≠ 1'});
D('minv','A','Multiplicative inverses','Invertibility is a condition on the existing multiplication.',{pa:['F'],fm:'∀a≠0 ∃b : ab = 1'});
D('field','S','Field','A commutative ring where every nonzero element is invertible and 0 ≠ 1.',{pa:['F'],w:6});
D('moduleaction','M','Module action','Candidate scalar action of a unital ring R on the additive abelian group (M,+). Its compatibility is imposed separately.',{pa:['R','V'],sig:'R × V → V',dom:['ring@R','abgrp@V'],cod:['abgrp@V'],lw:['madd','radd','mcomp','munit'],fm:'(r,v) ↦ r·v'});
D('madd','A','Module: vector additivity','Scalar multiplication preserves addition of module elements.',{pa:['R','V'],fm:'∀r∈R, m,n∈M: r(m+n)=rm+rn'});
D('radd','A','Module: scalar additivity','Addition in the scalar ring is respected.',{pa:['R','V'],fm:'∀r,s∈R,m∈M: (r+s)m=rm+sm'});
D('mcomp','A','Module: action associativity','Module action respects scalar multiplication in R.',{pa:['R','V'],fm:'∀r,s∈R,m∈M: (rs)m=r(sm)'});
D('munit','A','Module: unit action','The scalar identity acts as the identity on every module element.',{pa:['R','V'],fm:'∀m∈M: 1_R m=m'});
D('module','S','Left module','An abelian group with a unital associative left action by a ring satisfying both additive laws.',{pa:['R','V'],ty:['ring','abgrp'],p:'left R-module M',w:6});
D('vspace','S','Vector space','A unital left module over a field. The field restriction is the additional structure on the scalar ring, not a second scalar action.',{pa:['F','V'],ty:['field','abgrp'],p:'V over F',w:6,thm:'Every left module over a field is a vector space. Equivalently the scalar action induces a unital ring homomorphism F → End(V,+).'});

/* ---------- general algebra over a field: no associativity or unit assumed ---------- */
D('algleftdist','A','Algebra: left distributivity','The internal product distributes over addition in its second argument.',{pa:['F','V'],fm:'∀x,y,z∈V: B(x,y+z)=B(x,y)+B(x,z)'});
D('algrightdist','A','Algebra: right distributivity','The internal product distributes over addition in its first argument.',{pa:['F','V'],fm:'∀x,y,z∈V: B(x+y,z)=B(x,z)+B(y,z)'});
D('algleftscalar','A','Algebra: scalar in first slot','Multiplying the first argument by a scalar from F scales the result.',{pa:['F','V'],fm:'∀a∈F, x,y∈V: B(ax,y)=aB(x,y)'});
D('algrightscalar','A','Algebra: scalar in second slot','Multiplying the second argument by a scalar from F scales the result.',{pa:['F','V'],fm:'∀a∈F, x,y∈V: B(x,ay)=aB(x,y)'});
D('bilinear','M','Algebra multiplication','A new internal product on the existing F-vector space V. The four explicit bilinearity axioms constrain this map; no associativity or identity is required.',{pa:['F','V'],sig:'B: V × V → V',dom:['vspace@F,V','vspace@F,V'],cod:['vspace@F,V'],lw:['algleftdist','algrightdist','algleftscalar','algrightscalar'],fm:'B(x,y)=x·y; B(x+y,z)=B(x,z)+B(y,z); B(x,y+z)=B(x,y)+B(x,z); B(ax,y)=aB(x,y); B(x,ay)=aB(x,y)'});
D('falgebra','S','Algebra over F','An F-vector space V equipped with one F-bilinear internal product B: V×V→V. Neither associativity, commutativity nor a multiplicative identity is assumed.',{pa:['F','V'],ty:['field','abgrp'],p:'F-algebra V',w:6});


/* ---------- connected algebra refinements (every product is the existing B) ---------- */
D('aassoc','A','Algebra associativity','The existing bilinear product is associative.',{pa:['F','V'],fm:'∀x,y,z∈V: B(B(x,y),z)=B(x,B(y,z))'});
D('acomm','A','Algebra commutativity','The existing bilinear product is commutative.',{pa:['F','V'],fm:'∀x,y∈V: B(x,y)=B(y,x)'});
D('aunit','A','Algebra multiplicative unit','The existing bilinear product possesses a two-sided identity element.',{pa:['F','V'],fm:'∃e∈V ∀x∈V: B(e,x)=x=B(x,e)'});
D('aalt','A','Alternating product','Every element brackets with itself to zero, independent of characteristic.',{pa:['F','V'],fm:'∀x∈V: B(x,x)=0'});
D('ajacobi','A','Jacobi identity','Nested brackets satisfy the Jacobi identity. Together with alternation this defines a Lie algebra, including characteristic 2.',{pa:['F','V'],fm:'∀x,y,z∈V: B(x,B(y,z))+B(y,B(z,x))+B(z,B(x,y))=0'});
D('ajordan','A','Jordan identity','A commutative, generally nonassociative product satisfies the Jordan identity.',{pa:['F','V'],fm:'∀x,y∈V: B(B(B(x,x),y),x)=B(B(x,x),B(y,x))'});
D('alalt','A','Left alternativity','Repeated left multiplication associates.',{pa:['F','V'],fm:'∀x,y∈V: B(B(x,x),y)=B(x,B(x,y))'});
D('aralt','A','Right alternativity','Repeated right multiplication associates.',{pa:['F','V'],fm:'∀x,y∈V: B(B(y,x),x)=B(y,B(x,x))'});
D('aflex','A','Flexibility','Multiplication associates whenever outer factors coincide.',{pa:['F','V'],fm:'∀x,y∈V: B(B(x,y),x)=B(x,B(y,x))'});
D('aprelie','A','Pre-Lie (left-symmetric) identity','The associator is symmetric in its first two arguments.',{pa:['F','V'],fm:'∀x,y,z: B(B(x,y),z)-B(x,B(y,z))=B(B(y,x),z)-B(y,B(x,z))'});
D('aleib','A','Left Leibniz identity','Left multiplication acts as a derivation of the product.',{pa:['F','V'],fm:'∀x,y,z: B(x,B(y,z))=B(B(x,y),z)+B(y,B(x,z))'});
D('arcomm','A','Right-commutativity','Right multiplications commute.',{pa:['F','V'],fm:'∀x,y,z: B(B(x,y),z)=B(B(x,z),y)'});
D('aanti','A','Anticommutativity','The product changes sign on swapping its arguments. Unlike alternation alone, anticommutativity does not ensure B(x,x)=0 in characteristic 2.',{pa:['F','V'],fm:'∀x,y∈V: B(x,y)=-B(y,x)'});
D('assocalg','S','Associative algebra','An F-algebra with associative bilinear multiplication; a unit is not assumed.',{pa:['F','V'],ty:['field','abgrp'],p:'associative F-algebra',w:5});
D('commalg','S','Commutative algebra','An F-algebra with commutative multiplication; associativity is not assumed.',{pa:['F','V'],ty:['field','abgrp'],p:'commutative F-algebra',w:3});
D('unitalalg','S','Unital algebra','An F-algebra with a two-sided multiplicative identity; associativity is not assumed.',{pa:['F','V'],ty:['field','abgrp'],p:'unital F-algebra',w:3});
D('unitalassoc','S','Unital associative algebra','Associative F-algebra with a multiplicative unit.',{pa:['F','V'],ty:['field','abgrp'],p:'unital associative',w:5});
D('commassoc','S','Commutative associative algebra','An associative algebra with a commutative product; no unit assumed.',{pa:['F','V'],ty:['field','abgrp'],p:'commutative associative',w:4});
D('communitalassoc','S','Commutative unital associative algebra','Both commutative and unital, with an associative product.',{pa:['F','V'],ty:['field','abgrp'],p:'commutative unital',w:5});
D('liealg','S','Lie algebra','An F-algebra whose existing bilinear bracket is alternating and satisfies Jacobi; characteristic-independent definition.',{pa:['F','V'],ty:['field','abgrp'],p:'Lie algebra over F',w:6});
D('jordanalg','S','Jordan algebra','A commutative F-algebra satisfying the Jordan identity; valid in any characteristic under this definition.',{pa:['F','V'],ty:['field','abgrp'],p:'Jordan algebra',w:5});
D('alternativealg','S','Alternative algebra','An F-algebra obeying both left and right alternative identities.',{pa:['F','V'],ty:['field','abgrp'],p:'alternative algebra',w:4});
D('flexiblealg','S','Flexible algebra','An F-algebra satisfying flexibility.',{pa:['F','V'],ty:['field','abgrp'],p:'flexible algebra',w:2});
D('preliealg','S','Pre-Lie algebra','An F-algebra whose associator is symmetric in the first two variables.',{pa:['F','V'],ty:['field','abgrp'],p:'left-symmetric algebra',w:4});
D('leibnizalg','S','Left Leibniz algebra','An F-algebra satisfying the left Leibniz identity. Lie algebras satisfy this identity.',{pa:['F','V'],ty:['field','abgrp'],p:'left Leibniz algebra',w:4});
D('novikovalg','S','Novikov algebra','A pre-Lie algebra whose right multiplications commute.',{pa:['F','V'],ty:['field','abgrp'],p:'Novikov algebra',w:3});
D('anticommalg','S','Anticommutative algebra','An F-algebra with anticommutative multiplication. Characteristic 2 needs care.',{pa:['F','V'],ty:['field','abgrp'],p:'anticommutative',w:2});
/* The commutator is a NEW product, constructed from an associative product. */
D('commutator','M','Commutator bracket','A new bilinear map on the same vector space, B_new(x,y)=xy−yx, derived from associative multiplication. It is not a refinement of the old product.',{pa:['F','V'],sig:'[ , ]: V × V → V',dom:['vspace@F,V','vspace@F,V'],cod:['vspace@F,V'],fm:'[x,y]=xy−yx (xy is the associative-algebra product)'});
/* A derivation is an additional linear endomorphism of the associative algebra. */
D('derivmap','M','Derivation map','A candidate F-linear endomorphism D of V.',{pa:['F','V'],sig:'D: V → V',dom:['vspace@F,V'],cod:['vspace@F,V'],lw:['dlinear','dleib'],fm:'D:V→V'});
D('dlinear','A','Derivation linearity','The derivation is F-linear.',{pa:['F','V'],fm:'D(x+y)=D(x)+D(y); D(ax)=aD(x)'});

function panel(){const n=N[sel];
let h=`<div class="k" style="color:${C[n.k]}">${K[n.k]}${n.sig||n.p?` · <span class="m">${n.sig||n.p}</span>`:''}</div><h2>${n.name}</h2><p>${n.d}</p>`;
h+=`<div class="l">${n.pa.map((q,i)=>q+(n.ty[i]&&n.ty[i]!=n.id?' : '+N[n.ty[i]].name:'')).join(' · ')}</div>`;

if(n.k==='S'&&sel!=='set'){
 const delta=constructionDelta(sel),r=delta.r;
 if(r){
 const tag=(id,suffix='')=>chip(id,suffix);
 h+=`<div class="rt" style="border-color:#b18cff;background:#19162c"><div class="rh" style="color:#e9d8ff">What changes at this step?<span>${r.n}</span></div>`;
 if(delta.refinements.length){
  h+=`<div class="l" style="color:#d7b8ff">SAME INSTANCE — REFINED BY THIS CONSTRUCTION</div>`;
  for(const ref of delta.refinements){
   h+=`<div class="rt" style="border-color:${PURPLE};background:#211a36"><div class="rh" style="color:#e9d8ff">Same ${ref.parameter}: ${N[ref.weaker].name} → ${N[ref.stronger].name}</div>`;
   h+=`<div class="l">The same parameter is used by ${ref.inputs.map(id=>N[id].name).join(' and ')}. It is not an independent second structure.</div>`;
   for(const step of ref.steps){h+=`<div class="l" style="color:#e4c9ff">PROMOTED → ${tag(step.id,ref.parameter)}</div>`;
    if(step.axioms.length)h+=`<div class="l">NEW CONDITIONS ON THE EXISTING INSTANCE</div>${step.axioms.map(id=>tag(id)).join('')}`;
   }
   h+='</div>';
  }
 }
 if(delta.base.length)h+=`<div class="l">INHERITED — already built, not another operation</div>${delta.base.map(x=>tag(x.id,x.p)).join('')}`;
 if(delta.inheritedAxioms.length)h+=`<div class="l">ALREADY SATISFIED — axioms inherited from earlier stages</div>`+delta.inheritedAxioms.map(id=>tag(id)).join('');
 if(delta.maps.length)h+=`<div class="l" style="color:#f6c36d">${delta.semantic?.kind==='new'?'NEW OPERATION':'MAP INTRODUCED / USED'}</div>${delta.maps.map(x=>tag(x.id,x.p)).join('')}`;
 if(delta.axioms.length)h+=`<div class="l" style="color:#f6c36d">NEW REQUIRED AXIOMS — even when added to an OLD map</div>`+delta.axioms.map(x=>`<div>${tag(x.id)}<div class="l" style="margin:0 0 7px 2px">Applies to: ${(OCCURRENCE_SUBJECTS[x.id]||[]).map(v=>OPERATION_INSTANCES[v]?.symbol+' ['+OPERATION_INSTANCES[v]?.carrier+']').join(', ')||N[x.id].uses.map(m=>N[m].name).join(', ')||'existing structure'}</div></div>`).join('');
 const extra=delta.added.filter(x=>N[x.id]?.k==='S');
 if(extra.length)h+=`<div class="l">OTHER REQUIRED STRUCTURES (joint inputs / shared instances)</div>${extra.map(x=>tag(x.id,x.p)).join('')}`;
 if(delta.semantic)h+=`<div class="l" style="color:#e9d8ff">OPERATION IDENTITY: ${delta.semantic.explanation}</div>`;
 if(delta.entailed.length){const facts=[...new Map(delta.entailed.map(q=>[q.property,q])).values()];
 h+=`<div class="l" style="color:#9ce3b9">DERIVED — true automatically, not another axiom to impose</div>`+
 facts.map(q=>`<div class="l">${tag(q.property)} <span style="color:#95bba8">${q.why}</span></div>`).join('');}
 if(!delta.axioms.length&&!delta.maps.length&&!delta.entailed.length)
   h+=`<div class="l">This route adds no separate operation axiom; its specified inputs suffice.</div>`;
 h+='</div>';
 }
}
if(n.k==='S'){const ops=operationInstancesFor(sel);if(ops.length)h+=sc('Distinct operations in this structure')+ops.map(([id,o])=>`<div class="rt"><b>${o.symbol} : ${o.signature}</b><div class="l">${o.description}</div>${chip(o.template,'map template')}</div>`).join('');}
if(n.k==='A'){
 if(OCCURRENCE_SUBJECTS[sel])h+=sc('Operation instances involved')+OCCURRENCE_SUBJECTS[sel].map(id=>{const o=OPERATION_INSTANCES[id];return `<div class="l">${o.signature} — ${o.description}</div>`}).join('');
 h+=sc('Constrains (predicate subjects)')+n.uses.map(x=>chip(x)).join('');
 if(n.subjectNote)h+=`<div class="l">${n.subjectNote}</div>`;
 h+=`<div class="l">Purple dashed links connect this axiom to the maps it constrains. The axiom remains an obligatory part of applicable construction routes, without a duplicate gold arrow.</div>`;
}
if(n.k==='M'){
 const constraints=L.filter(a=>a.k==='A'&&a.uses.includes(n.id));
 if(constraints.length)h+=sc('Axioms involving this map')+constraints.map(a=>chip(a.id)).join('');
}
if(n.fm)h+=`<details><summary>Formal</summary><code>${n.fm}</code></details>`;
if(n.k=='M'){h+=sc('Domain')+[...new Set(n.dom)].map(x=>chip(x,n.dom.filter(y=>y==x).length>1?'× '+n.dom.filter(y=>y==x).length:'')).join('')+sc('Codomain')+[...new Set(n.cod)].map(x=>chip(x)).join('');
if(n.lw)h+=sc('Constrained by')+n.lw.map(x=>chip(x)).join('');
if(n.der)h+=sc('Derived from')+chip(n.der)+`<div class="l">Result of the construction. Never a prerequisite for it.</div>`}
const rs=R.map((r,i)=>[r,i]).filter(([r])=>r.t==sel);
if(rs.length)h+=sc('Requires')+rs.map(([r,i])=>{const f=r.in[0],rest=r.in.slice(1);
return`<div class="rt" data-r="${i}"><div class="rh">${r.n}<span>${{joint:'joint',refine:'refinement',kernel:'alternative · sufficient'}[r.m]}</span></div>`+
(r.m=='joint'?`<div class="l">All required together</div>${r.in.map(x=>chip(x.id,x.p)).join('')}`:
r.m=='refine'?`<div class="l">Inherits</div>${chip(f.id,f.p)}${rest.length?`<div class="l">Adds to the same bound instance</div>${rest.map(x=>chip(x.id,x.p)).join('')}`:''}${r.x.same?`<div class="l" style="color:${PURPLE}">Shared parameter: ${r.x.same.map(v=>v.parameter).join(', ')} — identical instance, not another copy.</div>`:''}`:
`<div class="l">Jointly required</div>${r.in.map(x=>chip(x.id,x.p)).join('')}<div class="l">${r.x.d||''}</div>`)+`</div>`}).join('');
const out=[...new Set(E.filter(e=>e.s==sel).map(e=>e.t))];
if(out.length)h+=sc('Used in')+out.map(x=>chip(x)).join('');
if(n.thm)h+=`<div class="th">${n.thm}</div>`;
h+=`<div class="ev" title="Evidence status: asserted definition, hand-verified, machine-checked">${[0,1,2].map(i=>`<b class="${i<=n.ev?'f':''}"></b>`).join('')}${['asserted','hand-verified','machine-checked'][n.ev]}</div>`;
ins.innerHTML=h}
ins.onclick=e=>{const b=e.target.closest('.chip');if(b){select(b.dataset.id);if(innerWidth<=820)ins.classList.remove('o')}};
ins.onmouseover=e=>{const r=e.target.closest('.rt'),v=r?+r.dataset.r:null;if(v!==hl){hl=v;draw()}};
ins.onmouseleave=()=>{if(hl!==null){hl=null;draw()}};
/* ---------- pointer interaction ---------- */
const pts=new Map();let drag=null,pan=null,pinch=null,edgePress=null;
// Prefer an available complete method for the currently inspected target.
// If the edge belongs elsewhere, inspect its target before choosing its method.
function chooseConstructionEdge(source,target){
 const candidates=[...new Set(E.filter(e=>e.s===source&&e.t===target).map(e=>e.ri))];
 if(!candidates.length)return;
 const available=()=>ms.map((method,i)=>({method,i})).filter(x=>candidates.some(r=>Object.values(x.method).includes(r)));
 let choices=available();
 if(!choices.length){select(target);choices=available()}
 if(!choices.length)return;
 const current=choices.findIndex(x=>x.i===mi);
 mi=choices[(current+1)%choices.length].i;
 setM();draw();panel();
}

const two=()=>{const a=[...pts.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}};
const rel=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{if(e.target.closest('#bar,#vp'))return;cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pts.size==2){drag=pan=null;pinch={d:two().d,k:cam.k};return}
const edgeTarget=e.target.closest('.route-hit');
if(edgeTarget){edgePress={source:edgeTarget.dataset.source,target:edgeTarget.dataset.target,sx:e.clientX,sy:e.clientY};drag=pan=null;cancelAnimationFrame(raf);return}
const g=e.target.closest('.n');cancelAnimationFrame(raf);
if(g)drag={id:g.dataset.id,sx:e.clientX,sy:e.clientY,mv:false,o:{...P[g.dataset.id]}};
else{pan={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};cv.classList.add('pan')}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pinch&&pts.size==2){const t=two(),r=cv.getBoundingClientRect();zoomAt(t.x-r.left,t.y-r.top,pinch.k*t.d/pinch.d);return}
if(edgePress)return;
if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.mv&&Math.hypot(dx,dy)>6)drag.mv=true;
if(drag.mv){manual[drag.id]=P[drag.id]={x:drag.o.x+dx/cam.k,y:drag.o.y+dy/cam.k};draw()}}
else if(pan){cam.x=pan.cx+e.clientX-pan.sx;cam.y=pan.cy+e.clientY-pan.sy;apply()}});
const up=e=>{if(!pts.delete(e.pointerId))return;if(pts.size<2)pinch=null;
if(edgePress){const q=edgePress;edgePress=null;if(Math.hypot(e.clientX-q.sx,e.clientY-q.sy)<9)chooseConstructionEdge(q.source,q.target)}
else if(drag&&!drag.mv)select(drag.id);drag=pan=null;cv.classList.remove('pan')};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{if(e.target.closest('#vp'))return;e.preventDefault();const p=rel(e);zoomAt(p.x,p.y,cam.k*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
sv.addEventListener('keydown',e=>{const g=e.target.closest('.n');if(g&&(e.key=='Enter'||e.key==' ')){e.preventDefault();select(g.dataset.id)}});
/* ---------- controls ---------- */
const $=id=>document.getElementById(id);
$('focus').onclick=()=>{focused=!focused;$('focus').textContent=focused?'Focused ✓':'All branches';$('focus').setAttribute('aria-pressed',String(focused));draw();fit()};$('methodsList').onclick=()=>{const open=$('methodMenu').classList.toggle('open');$('methodsList').setAttribute('aria-expanded',String(open))};$('methodMenu').onclick=e=>{const b=e.target.closest('[data-method]');if(!b)return;mi=+b.dataset.method;setM();draw();$('methodMenu').classList.remove('open');$('methodsList').setAttribute('aria-expanded','false')};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#mw,#methodMenu')){$('methodMenu').classList.remove('open');$('methodsList').setAttribute('aria-expanded','false')}});$('bk').onclick=back;$('fw').onclick=fwd;$('rn').onclick=rand;$('mp').onclick=()=>{mi=(mi-1+ms.length)%ms.length;setM();draw()};$('mn').onclick=()=>{mi=(mi+1)%ms.length;setM();draw()};$('tg').onclick=()=>ins.classList.toggle('o');
$('dp').oninput=e=>{depth=+e.target.value;$('dv').textContent=depth;layout();draw();fit()};
$('nl').innerHTML=L.map(n=>`<option value="${n.name}">`).join('');
$('q').onchange=e=>{const n=L.find(n=>n.name.toLowerCase()==e.target.value.trim().toLowerCase())||L.find(n=>n.name.toLowerCase().includes(e.target.value.trim().toLowerCase()));if(n){select(n.id);e.target.value='';e.target.blur()}};
$('vb').textContent=`⊢ ${vOK}/${V.length}`;$('vb').style.color=vOK==V.length?'#7be0b4':'#f87171';
$('vp').innerHTML=V.map(v=>`<div style="color:${v[1]?'#7be0b4':'#f87171'}">${v[1]?'✓':'✗'} ${v[0]}</div>`).join('');
$('vb').onclick=()=>$('vp').classList.toggle('o');
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'&&e.key!='Escape')return;
if(e.key=='/'){e.preventDefault();$('q').focus()}else if(e.altKey&&e.key=='ArrowLeft')back();else if(e.altKey&&e.key=='ArrowRight')fwd();else if(e.key=='r'&&!e.metaKey&&!e.ctrlKey)rand();else if(e.key=='[')$('mp').click();else if(e.key==']')$('mn').click();else if(e.key=='Escape'){$('methodMenu').classList.remove('open');$('methodsList').setAttribute('aria-expanded','false');$('vp').classList.remove('o');document.activeElement.blur()}});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>fit(0),120)});
const h0=location.hash.slice(1);select(N[h0]?h0:'vspace',true,0);
</script></body></html>
